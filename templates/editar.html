{% extends "base.html" %}
{% block titulo %}Modificar documento{% endblock %}
{% block contenido %}
<h1>Modificar documento</h1>
<p>Empleado: <strong>{{ doc.nombre }}</strong><br>
Documento: <strong>{{ doc.documento }}</strong><br>
Estado actual: <strong>{{ doc.estado }}</strong></p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/documentos/editar/{{ doc.id }}" class="formulario">
<label>Nuevo estado</label>
<select name="estado">
<option value="">-- Elige un estado --</option>
<option value="Completo">Completo</option>
<option value="Pendiente">Pendiente</option>
</select>
<button type="submit">Guardar</button>
</form>
{% endblock %}
